creative:
  - title: 'U-5 Group Exhibition'
    year: 2024
    description: 'A group exhibition of eleven early-career artists currently working or affiliated with “Nishimura Village” – an artist-architecture community in Kobe, Japan.'
    url: 'https://www.instagram.com/p/C5s69lQvb0-/'
    image: '/assets/images/u-5.jpg'

  - title: 'Haioku Runway Show'
    year: 2024
    description: 'A performance project and zine I participated in exploring how a vacant, abandoned home can be reused and honored. Literally reusing old suits and kimonos left in the house, artists gathered to stage a fashion show, stitching together material remnants, each embodied a “yokai” (Japanese spirit) drifting through the space as its physical demolition occurred simultaneously on-site.'
    url: 'https://www.instagram.com/p/C7EaVRShTjq/'
    image: '/assets/images/haioku-runway.jpg'

