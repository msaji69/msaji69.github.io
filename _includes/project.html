<li class="project-wrap" data-controller="project">
  <button
    class="project-card"
    data-action="click->project#openModal"
    style="background-image: url('{{ project.image }}')"
    aria-label="Open details for {{ project.title }}"
  >
    <div class="card-overlay">
      <h3>
        {{ project.title }}
        <i>({{project.year}})</i>
      </h3>
    </div>
  </button>

  <dialog class="project-modal" data-project-target="modal" closedby="any">
    <button
      class="modal-close"
      aria-label="Close modal"
      data-action="click->project#closeModal"
      autofocus
    >
      {% include icons/x.html %}
    </button>
    <h3>
      {{ project.title }}
      <i>({{project.year}})</i>
    </h3>
    <p>{{ project.description }}</p>
    <p>
      <a href="{{project.url}}">Learn more</a>
    </p>
  </dialog>
</li>
